# Machine-readable trigger for the evaluation harness.
tool: dotnet list package --vulnerable
slug: nuget-audit
kind: sdk
status: active
target_framework: net472
language_version: "7.3"
runner: tools/nuget-audit/run.sh
expects:
  exit_code: 0
  reason: >-
    The planted pins are PackageReference items, so `dotnet list package --vulnerable` reads them directly. `--no-restore` is left out: an 8.0 SDK rejects it and prints its help text instead of a report.
metrics:
  primary_for: 8
  alternative_for: 0
