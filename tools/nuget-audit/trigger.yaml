# Machine-readable trigger for the evaluation harness.
tool: dotnet list package --vulnerable
slug: nuget-audit
kind: sdk
status: active
target_framework: net47
language_version: "7.1"
runner: tools/nuget-audit/run.sh
expects:
  exit_code: 0
  reason: >-
    PackageReference with central versions, so `dotnet list package --vulnerable` reads the planted pins directly. `--no-restore` is left out: the 8.0 SDK pinned here rejects it and prints its help text instead of a report.
metrics:
  primary_for: 8
  alternative_for: 0
